# Checks only: nothing is published, deployed or pushed to a registry.
#
# One job per server, each running when its own directory changes. A change
# anywhere outside servers/ (packages/core, root tooling, lint rules,
# scripts, this workflow) runs every server's job. To add a server, add a
# filter under `changes` and a job like `fio`, and list it in `ci`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists a pull request's files through the API
    outputs:
      shared: ${{ steps.filter.outputs.shared }}
      fio: ${{ steps.filter.outputs.fio }}
      datova-schranka: ${{ steps.filter.outputs.datova-schranka }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A file counts for a filter only when it matches every pattern, so
          # `shared` is anything outside servers/.
          predicate-quantifier: every
          filters: |
            shared:
              - '**'
              - '!servers/**'
            fio:
              - 'servers/fio/**'
            datova-schranka:
              - 'servers/datova-schranka/**'

  fio:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.fio == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # NODE_IMAGE in servers/fio/Dockerfile
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The root packageManager field (bun@1.4.2)
          bun-version-file: package.json
      # Also runs the root prepare script: patches TypeScript for the Effect
      # diagnostics and builds packages/core and servers/fio.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run test
      - run: bun run generate:check
      # The ship script and core boundary lint rule tests
      - run: bun run test:scripts

  datova-schranka:
    needs: changes
    if: needs.changes.outputs.shared == 'true' || needs.changes.outputs.datova-schranka == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # NODE_IMAGE in servers/fio/Dockerfile
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # The root packageManager field (bun@1.4.2)
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # The transport tests need the openssl CLI, which ubuntu runners ship.
      - run: bun run test

  # The one check to require in branch protection: it fails when any server
  # job failed or was cancelled, and passes when they passed or were skipped.
  ci:
    needs: [changes, fio, datova-schranka]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
